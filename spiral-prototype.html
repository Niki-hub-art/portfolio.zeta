<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spiraal Prototype</title>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"
  }
}
</script>
<style>
  html, body { margin: 0; padding: 0; background: #000; height: 100%; overflow: hidden; }
  #scene-container { position: fixed; inset: 0; }
  #scene-container canvas { display: block; width: 100%; height: 100%; }
  #hint {
    position: fixed;
    top: 1rem;
    left: 1rem;
    color: #60a5fa;
    font-family: system-ui, sans-serif;
    font-size: 0.8rem;
    opacity: 0.6;
    z-index: 10;
  }
</style>
</head>
<body>
<div id="scene-container"></div>
<div id="hint">beweeg cursor omlaag om te versnellen</div>
<script type="module">
import * as THREE from "three";

/* =====================================================
   DATA — 5 placeholder kaartjes
   ===================================================== */
function placeholderThumb(label) {
  const W = 480, H = 288; // breed rechthoekig, matcht de kaartjes-verhouding
  const canvas = document.createElement("canvas");
  canvas.width = W;
  canvas.height = H;
  const ctx = canvas.getContext("2d");
  const grad = ctx.createLinearGradient(0, 0, W, H);
  grad.addColorStop(0, "#0a0a0f");
  grad.addColorStop(1, "#050505");
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H);
  ctx.strokeStyle = "rgba(29,78,216,0.6)";
  ctx.lineWidth = 6;
  ctx.strokeRect(3, 3, W - 6, H - 6);
  ctx.fillStyle = "#60a5fa";
  ctx.font = "bold 34px system-ui, sans-serif";
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.fillText(label, W / 2, H / 2);
  return canvas;
}

const PROJECTS = ["Website 1", "Website 2", "Website 3", "Website 4", "Website 5"]
  .map((name) => ({ name, canvas: placeholderThumb(name) }));

/* =====================================================
   SCENE SETUP
   ===================================================== */
const container = document.getElementById("scene-container");
const scene = new THREE.Scene();

const camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 100);
camera.position.set(0, 0, 58); // y=0: recht op de as, geen kanteling
camera.lookAt(0, 0, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.setSize(container.clientWidth, container.clientHeight);
container.appendChild(renderer.domElement);

scene.add(new THREE.AmbientLight(0x223355, 1.6));
const keyLight = new THREE.DirectionalLight(0x8fb4ff, 1.0);
keyLight.position.set(3, 5, 6);
scene.add(keyLight);

/* =====================================================
   SPIRAL PARAMETERS
   De kaartjes draaien om een onzichtbare verticale as (geen
   zichtbare cilinder/buis) en bewegen tegelijk verticaal —
   een echte helix, geen platte kolom.
   ===================================================== */
const RADIUS = 32;                  // afstand van de kaartjes tot de centrale as (vergroot voor veilige tangentiële ruimte)
const CARD_WIDTH = 2.9, CARD_HEIGHT = 1.74; // breed rechthoekig, geen vierkant
const NUM_VISIBLE_TURNS = 3;        // hele getal -> naadloze hoek-wrap
const LOOP_HEIGHT = 130;            // modulo-periode (wereld-eenheden) — groter voor veel meer buffer rond het naadpunt
const NUM_CARD_SLOTS = 55;          // aantal kaartjes — meer, voor kleinere tussenafstand (compacter)
const CARD_SPACING = LOOP_HEIGHT / NUM_CARD_SLOTS;
const ANGULAR_RATE = (2 * Math.PI * NUM_VISIBLE_TURNS) / LOOP_HEIGHT;

// Hoe dicht een kaartje qua hoek bij "vooraan" (angle 0) moet zijn om
// het extra focus-vergroting te krijgen, en hoeveel groter het dan wordt.
const FOCUS_WINDOW = ANGULAR_RATE * CARD_SPACING * 1.6;
const FOCUS_SCALE_BOOST = 0.4; // het kaartje vooraan wordt tot 1.4x zo groot

const cardGeo = new THREE.PlaneGeometry(CARD_WIDTH, CARD_HEIGHT);
const cards = [];

for (let i = 0; i < NUM_CARD_SLOTS; i++) {
  const project = PROJECTS[i % PROJECTS.length];
  const texture = new THREE.CanvasTexture(project.canvas);
  texture.needsUpdate = true;

  const mat = new THREE.MeshBasicMaterial({ map: texture, side: THREE.DoubleSide, transparent: true });
  const mesh = new THREE.Mesh(cardGeo, mat);
  scene.add(mesh);

  cards.push({ mesh, mat, baseT: i * CARD_SPACING, project });
}

// Hoek genormaliseerd naar [-PI, PI], zodat "afstand tot vooraan" altijd de
// kortste weg neemt (nodig voor de focus-vergroting).
function normalizedAngle(angle) {
  let a = ((angle % (2 * Math.PI)) + 2 * Math.PI) % (2 * Math.PI);
  if (a > Math.PI) a -= 2 * Math.PI;
  return a;
}

function layoutCards(phase) {
  for (const c of cards) {
    let t = (c.baseT + phase) % LOOP_HEIGHT;
    if (t < 0) t += LOOP_HEIGHT;
    t -= LOOP_HEIGHT / 2; // centreer het wrap-bereik rond 0 (wrap-punt blijft buiten beeld)

    const angle = t * ANGULAR_RATE;
    const normAngle = normalizedAngle(angle);
    const x = RADIUS * Math.sin(angle);
    const z = RADIUS * Math.cos(angle);
    const y = t;

    // Focus-vergroting: vloeiende (smoothstep) opleving naar 1 exact vooraan.
    const focusT = THREE.MathUtils.clamp(1 - Math.abs(normAngle) / FOCUS_WINDOW, 0, 1);
    const focusAmount = focusT * focusT * (3 - 2 * focusT);
    const scale = 1 + focusAmount * FOCUS_SCALE_BOOST;

    c.mesh.position.set(x, y, z);
    c.mesh.rotation.set(0, angle, 0); // naar buiten gericht, weg van de centrale as
    c.mesh.scale.set(scale, scale, 1);

    const depthFacing = (z + RADIUS) / (2 * RADIUS); // 0..1, 1 = dichtst bij camera
    c.mat.opacity = THREE.MathUtils.lerp(0.3, 1, depthFacing);
  }
}

/* =====================================================
   BEWEGING — doorlopende, autonome rotatie die nooit vanzelf stopt
   (rustig basistempo, ONGEWIJZIGD), met een tijdelijke versnelling
   wanneer de cursor in dezelfde richting meebeweegt.

   De cursorsnelheid wordt per RENDERFRAME geschat (nooit per los
   pointermove-event) — een event-to-event tijdsverschil kan toevallig
   heel klein zijn, wat de oude per-event (dy/dt)-schatting soms liet
   pieken en zo een abrupte sprong gaf. Door ruwe pixels te accumuleren
   en pas één keer per frame om te rekenen naar een snelheid, en die
   vervolgens door twee lagen vloeiende demping te halen (snelheid ->
   boost -> tempo), is de opbouw altijd een continue curve zonder
   sprongen, met een duidelijk lager maximum dan voorheen.
   ===================================================== */
const FRAME_MS = 1000 / 60;
const BASE_SPEED = 0.0075;   // fase-eenheden per 60fps-frame — rustig, doorlopend basistempo (ongewijzigd)
const BOOST_GAIN = 0.01;
const MAX_BOOST = 0.16;      // duidelijk lager dan voorheen (was 0.38)
const VELOCITY_EASE = 0.2;   // vloeit de ruwe pixels/frame-schatting glad
const BOOST_EASE = 0.1;      // vloeit de boost geleidelijk naar zijn doelwaarde (op- én afbouw)
const SPEED_EASE = 0.12;     // vloeit het uiteindelijke tempo (ongewijzigd)

let phase = 0;
let currentSpeed = BASE_SPEED;
let boost = 0;
let velocitySmoothed = 0;
let pendingPixels = 0; // ruwe omlaag-beweging sinds het laatst gerenderde frame
let lastPointerY = null;

window.addEventListener("pointermove", (e) => {
  if (lastPointerY !== null) {
    const dy = e.clientY - lastPointerY; // omlaag = positief
    if (dy > 0) pendingPixels += dy; // enkel accumuleren — geen timing/snelheid hier
  }
  lastPointerY = e.clientY;
}, { passive: true });

/* =====================================================
   PRECIEZE KLIKBAARHEID — het kaartje vooraan (en elk ander kaartje)
   blijft op elk moment exact hit-testbaar via raycasting tegen de
   actuele 3D-transforms, ook terwijl de spiraal doorlopend draait.
   (Nog geen expand-overlay hier — dat komt pas bij het invoegen in de
   hoofdportfolio; dit demonstreert/bewaart enkel de precisie zelf.)
   ===================================================== */
const raycaster = new THREE.Raycaster();
const pointerNDC = new THREE.Vector2();

renderer.domElement.addEventListener("click", (e) => {
  const rect = renderer.domElement.getBoundingClientRect();
  pointerNDC.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
  pointerNDC.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
  raycaster.setFromCamera(pointerNDC, camera);
  const hits = raycaster.intersectObjects(cards.map((c) => c.mesh), false);
  if (!hits.length) return;
  const card = cards.find((c) => c.mesh === hits[0].object);
  card.mat.color.set(0x60a5fa);
  setTimeout(() => card.mat.color.set(0xffffff), 150);
});

/* =====================================================
   RENDER LOOP
   ===================================================== */
let lastFrameTime = null;

function tick(now) {
  if (lastFrameTime === null) lastFrameTime = now;
  const dt = Math.min(now - lastFrameTime, 100);
  lastFrameTime = now;
  const dtFactor = dt / FRAME_MS;

  // Eén snelheids-schatting per frame (pixels per 60fps-frame-equivalent),
  // niet per event — dit is wat de vorige abrupte sprong voorkomt.
  const pixelsThisFrame = dtFactor > 0 ? pendingPixels / dtFactor : 0;
  pendingPixels = 0;

  const velocityEaseFactor = 1 - Math.pow(1 - VELOCITY_EASE, dtFactor);
  velocitySmoothed += (pixelsThisFrame - velocitySmoothed) * velocityEaseFactor;

  const boostTarget = Math.min(velocitySmoothed * BOOST_GAIN, MAX_BOOST);
  const boostEaseFactor = 1 - Math.pow(1 - BOOST_EASE, dtFactor);
  boost += (boostTarget - boost) * boostEaseFactor;

  const targetSpeed = BASE_SPEED + boost;
  currentSpeed += (targetSpeed - currentSpeed) * (1 - Math.pow(1 - SPEED_EASE, dtFactor));
  phase += currentSpeed * dtFactor;

  layoutCards(phase);
  renderer.render(scene, camera);
  requestAnimationFrame(tick);
}

layoutCards(phase);
requestAnimationFrame(tick);

window.addEventListener("resize", () => {
  camera.aspect = container.clientWidth / container.clientHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(container.clientWidth, container.clientHeight);
});
</script>
</body>
</html>
