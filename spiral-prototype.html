<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spiraal Prototype</title>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"
  }
}
</script>
<style>
  html, body { margin: 0; padding: 0; background: #000; height: 100%; overflow: hidden; }
  #scene-container { position: fixed; inset: 0; }
  #scene-container canvas { display: block; width: 100%; height: 100%; }
  #hint {
    position: fixed;
    top: 1rem;
    left: 1rem;
    color: #60a5fa;
    font-family: system-ui, sans-serif;
    font-size: 0.8rem;
    opacity: 0.6;
    z-index: 10;
  }
</style>
</head>
<body>
<div id="scene-container"></div>
<div id="hint">cursor boven/onder het midden = richting &amp; snelheid</div>
<script type="module">
import * as THREE from "three";

/* =====================================================
   DATA — 5 placeholder kaartjes
   ===================================================== */
function placeholderThumb(label) {
  const W = 480, H = 288; // breed rechthoekig, matcht de kaartjes-verhouding
  const canvas = document.createElement("canvas");
  canvas.width = W;
  canvas.height = H;
  const ctx = canvas.getContext("2d");
  const grad = ctx.createLinearGradient(0, 0, W, H);
  grad.addColorStop(0, "#0a0a0f");
  grad.addColorStop(1, "#050505");
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H);
  ctx.strokeStyle = "rgba(29,78,216,0.6)";
  ctx.lineWidth = 6;
  ctx.strokeRect(3, 3, W - 6, H - 6);
  ctx.fillStyle = "#60a5fa";
  ctx.font = "bold 34px system-ui, sans-serif";
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.fillText(label, W / 2, H / 2);
  return canvas;
}

const PROJECTS = ["Website 1", "Website 2", "Website 3", "Website 4", "Website 5"]
  .map((name) => ({ name, canvas: placeholderThumb(name) }));

/* =====================================================
   SCENE SETUP
   ===================================================== */
const container = document.getElementById("scene-container");
const scene = new THREE.Scene();

const camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 150);
camera.position.set(0, 0, 72); // y=0: recht op de as, geen kanteling
camera.lookAt(0, 0, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.setSize(container.clientWidth, container.clientHeight);
container.appendChild(renderer.domElement);

scene.add(new THREE.AmbientLight(0x223355, 1.6));
const keyLight = new THREE.DirectionalLight(0x8fb4ff, 1.0);
keyLight.position.set(3, 5, 6);
scene.add(keyLight);

/* =====================================================
   SPIRAL PARAMETERS
   De kaartjes draaien om een onzichtbare verticale as (geen
   zichtbare cilinder/buis) en bewegen tegelijk verticaal —
   een echte helix, geen platte kolom.
   ===================================================== */
const RADIUS = 40;                  // afstand van de kaartjes tot de centrale as (vergroot om de grotere/dichtere kaartjes veilig te dragen)
const CARD_WIDTH = 4.1, CARD_HEIGHT = 2.46; // breed rechthoekig, fors groter dan voorheen (was 2.9 x 1.74)
const NUM_VISIBLE_TURNS = 3;        // hele getal -> naadloze hoek-wrap
const LOOP_HEIGHT = 130;            // modulo-periode (wereld-eenheden) — ongewijzigd, bewaart de geverifieerde naadpunt-buffer
const NUM_CARD_SLOTS = 72;          // meer kaartjes over dezelfde LOOP_HEIGHT -> kleinere tussenafstand (compacter)
const CARD_SPACING = LOOP_HEIGHT / NUM_CARD_SLOTS;
const ANGULAR_RATE = (2 * Math.PI * NUM_VISIBLE_TURNS) / LOOP_HEIGHT;

// Dunne, licht doorschijnende cilinder op exact dezelfde as/straal als het
// kaartjes-pad, zodat de kaartjes er visueel "op geplakt" lijken.
const CYLINDER_RADIUS = RADIUS * 0.97; // net iets kleiner, zodat kaartjes vlak op/tegen het oppervlak zitten zonder z-fighting
const cylinderGeo = new THREE.CylinderGeometry(CYLINDER_RADIUS, CYLINDER_RADIUS, LOOP_HEIGHT, 64, 1, true);
// MeshStandardMaterial (niet MeshBasicMaterial) zodat de bestaande scene-lichten
// een schaduw-gradiënt over het gebogen oppervlak geven — anders is een
// onbelichte transparante cilinder gewoon een platte kleurtint over het hele
// scherm, zonder enige visuele aanwijzing dat het om een ronde buis gaat.
const cylinderMat = new THREE.MeshStandardMaterial({
  color: 0x2d5bdb,
  transparent: true,
  opacity: 0.13,
  roughness: 0.4,
  metalness: 0.1,
  side: THREE.DoubleSide,
  depthWrite: false,
});
const cylinderMesh = new THREE.Mesh(cylinderGeo, cylinderMat);
scene.add(cylinderMesh);

// Hoe dicht een kaartje qua hoek bij "vooraan" (angle 0) moet zijn om
// het extra focus-vergroting te krijgen, en hoeveel groter het dan wordt.
const FOCUS_WINDOW = ANGULAR_RATE * CARD_SPACING * 1.6;
const FOCUS_SCALE_BOOST = 0.4; // het kaartje vooraan wordt tot 1.4x zo groot

const cardGeo = new THREE.PlaneGeometry(CARD_WIDTH, CARD_HEIGHT);
const cards = [];

for (let i = 0; i < NUM_CARD_SLOTS; i++) {
  const project = PROJECTS[i % PROJECTS.length];
  const texture = new THREE.CanvasTexture(project.canvas);
  texture.needsUpdate = true;

  const mat = new THREE.MeshBasicMaterial({ map: texture, side: THREE.DoubleSide, transparent: true });
  const mesh = new THREE.Mesh(cardGeo, mat);
  scene.add(mesh);

  cards.push({ mesh, mat, baseT: i * CARD_SPACING, project });
}

// Hoek genormaliseerd naar [-PI, PI], zodat "afstand tot vooraan" altijd de
// kortste weg neemt (nodig voor de focus-vergroting).
function normalizedAngle(angle) {
  let a = ((angle % (2 * Math.PI)) + 2 * Math.PI) % (2 * Math.PI);
  if (a > Math.PI) a -= 2 * Math.PI;
  return a;
}

function layoutCards(phase) {
  for (const c of cards) {
    let t = (c.baseT + phase) % LOOP_HEIGHT;
    if (t < 0) t += LOOP_HEIGHT;
    t -= LOOP_HEIGHT / 2; // centreer het wrap-bereik rond 0 (wrap-punt blijft buiten beeld)

    const angle = t * ANGULAR_RATE;
    const normAngle = normalizedAngle(angle);
    const x = RADIUS * Math.sin(angle);
    const z = RADIUS * Math.cos(angle);
    const y = t;

    // Focus-vergroting: vloeiende (smoothstep) opleving naar 1 exact vooraan.
    const focusT = THREE.MathUtils.clamp(1 - Math.abs(normAngle) / FOCUS_WINDOW, 0, 1);
    const focusAmount = focusT * focusT * (3 - 2 * focusT);
    const scale = 1 + focusAmount * FOCUS_SCALE_BOOST;

    c.mesh.position.set(x, y, z);
    c.mesh.rotation.set(0, angle, 0); // naar buiten gericht, weg van de centrale as
    c.mesh.scale.set(scale, scale, 1);

    const depthFacing = (z + RADIUS) / (2 * RADIUS); // 0..1, 1 = dichtst bij camera
    c.mat.opacity = THREE.MathUtils.lerp(0.3, 1, depthFacing);
  }
}

/* =====================================================
   BEWEGING — doorlopende, autonome rotatie die nooit vanzelf stopt
   (rustig basistempo, ONGEWIJZIGD), met een positie-gebaseerde
   versnelling: niet de cursor-BEWEGING (delta/frame) bepaalt de
   snelheid, maar de cursor-POSITIE zelf, als percentage van de halve
   vensterhoogte t.o.v. het midden. Dit blijft dus werken zolang de
   cursor stilstaat op een positie (bv. tegen de rand van het scherm),
   in tegenstelling tot het oude delta-systeem dat terugviel naar het
   basistempo zodra er geen nieuwe beweging meer binnenkwam.

   Boven het midden = negatieve offset = tegengestelde richting;
   onder het midden = positieve offset = zelfde richting als het
   basistempo. Op precies het midden (offset 0) is de doelsnelheid
   exact BASE_SPEED — het rustige basistempo is dus een natuurlijk
   speciaal geval van deze formule, geen aparte code-pad.
   ===================================================== */
const FRAME_MS = 1000 / 60;
const BASE_SPEED = 0.0075;   // fase-eenheden per 60fps-frame — rustig, doorlopend basistempo (ongewijzigd, expliciet vastgezet)
const MAX_BOOST = 0.16;      // maximale extra snelheid bij volle uitwijking naar de rand (ongewijzigd t.o.v. vorige ronde)
const POSITION_EASE = 0.12;  // vloeit de doelsnelheid geleidelijk in (zelfde soort easing als voorheen SPEED_EASE)

let phase = 0;
let currentSpeed = BASE_SPEED;
let pointerOffsetRatio = 0; // -1 (bovenrand) .. 0 (midden) .. 1 (onderrand)

function updatePointerOffset(clientY) {
  const halfHeight = window.innerHeight / 2;
  pointerOffsetRatio = THREE.MathUtils.clamp((clientY - halfHeight) / halfHeight, -1, 1);
}

window.addEventListener("pointermove", (e) => {
  updatePointerOffset(e.clientY);
}, { passive: true });

/* =====================================================
   PRECIEZE KLIKBAARHEID — het kaartje vooraan (en elk ander kaartje)
   blijft op elk moment exact hit-testbaar via raycasting tegen de
   actuele 3D-transforms, ook terwijl de spiraal doorlopend draait.
   (Nog geen expand-overlay hier — dat komt pas bij het invoegen in de
   hoofdportfolio; dit demonstreert/bewaart enkel de precisie zelf.)
   ===================================================== */
const raycaster = new THREE.Raycaster();
const pointerNDC = new THREE.Vector2();

renderer.domElement.addEventListener("click", (e) => {
  const rect = renderer.domElement.getBoundingClientRect();
  pointerNDC.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
  pointerNDC.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
  raycaster.setFromCamera(pointerNDC, camera);
  const hits = raycaster.intersectObjects(cards.map((c) => c.mesh), false);
  if (!hits.length) return;
  const card = cards.find((c) => c.mesh === hits[0].object);
  card.mat.color.set(0x60a5fa);
  setTimeout(() => card.mat.color.set(0xffffff), 150);
});

/* =====================================================
   RENDER LOOP
   ===================================================== */
let lastFrameTime = null;

function tick(now) {
  if (lastFrameTime === null) lastFrameTime = now;
  const dt = Math.min(now - lastFrameTime, 100);
  lastFrameTime = now;
  const dtFactor = dt / FRAME_MS;

  // Doelsnelheid rechtstreeks uit de huidige cursor-POSITIE (niet uit
  // beweging), dus dit blijft gelden zolang de cursor stil op die
  // positie blijft staan — ook aan de fysieke rand van het scherm.
  const targetSpeed = BASE_SPEED + pointerOffsetRatio * MAX_BOOST;
  currentSpeed += (targetSpeed - currentSpeed) * (1 - Math.pow(1 - POSITION_EASE, dtFactor));
  phase += currentSpeed * dtFactor;

  layoutCards(phase);
  renderer.render(scene, camera);
  requestAnimationFrame(tick);
}

layoutCards(phase);
requestAnimationFrame(tick);

window.addEventListener("resize", () => {
  camera.aspect = container.clientWidth / container.clientHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(container.clientWidth, container.clientHeight);
});
</script>
</body>
</html>
